name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      javascript: ${{ steps.filter.outputs.javascript }}
      supervisor: ${{ steps.filter.outputs.supervisor }}
      static: ${{ steps.filter.outputs.static }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          ci_outputs="${RUNNER_TEMP}/ci-outputs.json"
          node ./scripts/check-plan.mjs \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --ci-outputs > "$ci_outputs"

          node -e 'const fs = require("node:fs"); const outputs = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); for (const key of ["javascript", "supervisor", "static"]) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${outputs[key] ? "true" : "false"}\n`); console.log(JSON.stringify(outputs, null, 2));' "$ci_outputs"

  fast:
    if: github.event_name == 'pull_request'
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure repo-local Git hooks
        run: git config core.hooksPath .githooks

      - name: Fetch base branch for workspace protocol tests
        run: git fetch origin main:refs/remotes/origin/main

      - name: Run fast workflow checks
        run: pnpm run check:fast

  static:
    if: always() && github.event_name == 'pull_request' && needs.changes.outputs.static == 'true'
    needs:
      - changes
      - fast
      - static_bundle
    runs-on: ubuntu-latest

    steps:
      - name: Verify required static bundle gate
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Change detection failed before static gate: ${{ needs.changes.result }}"
            exit 1
          fi

          if [ "${{ needs.fast.result }}" != "success" ]; then
            echo "Fast workflow checks failed before static gate: ${{ needs.fast.result }}"
            exit 1
          fi

          if [ "${{ needs.static_bundle.result }}" != "success" ]; then
            echo "Static bundle checks were required but did not pass: ${{ needs.static_bundle.result }}"
            exit 1
          fi

          echo "Required static bundle checks passed."

  static_bundle:
    if: github.event_name == 'pull_request' && needs.changes.outputs.static == 'true'
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bundle:
          - core
          - manager
          - workspace
          - policy
          - pipeline-dashboard
          - anti-churn

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure repo-local Git hooks
        run: git config core.hooksPath .githooks

      - name: Fetch base branch for workspace protocol tests
        run: git fetch origin main:refs/remotes/origin/main

      - name: Run static bundle report
        shell: bash
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/static-bundle-reports"
          mkdir -p "$report_dir"
          node ./scripts/run-static-bundle.mjs "${{ matrix.bundle }}" \
            --report "$report_dir/${{ matrix.bundle }}.json" \
            --head-sha "${{ github.event.pull_request.head.sha }}"

      - name: Upload static bundle timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-bundle-report-${{ matrix.bundle }}
          path: ${{ runner.temp }}/static-bundle-reports/${{ matrix.bundle }}.json
          if-no-files-found: warn

  static_bundle_summary:
    if: always() && github.event_name == 'pull_request' && needs.changes.outputs.static == 'true'
    needs:
      - changes
      - static
      - static_bundle
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download static bundle timing reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: static-bundle-report-*
          path: ${{ runner.temp }}/static-bundle-reports
          merge-multiple: true

      - name: Summarize static bundle evidence
        shell: bash
        run: |
          set -euo pipefail
          summary_dir="${RUNNER_TEMP}/static-bundle-summary"
          mkdir -p "$summary_dir"
          node ./scripts/summarize-static-bundle-reports.mjs \
            --reports-dir "${RUNNER_TEMP}/static-bundle-reports" \
            --out "$summary_dir/static-bundle-summary.json" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --static-result "${{ needs.static.result }}" \
            --static-bundle-result "${{ needs.static_bundle.result }}" \
            --static-bundle-required

      - name: Upload static bundle summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-bundle-summary
          path: ${{ runner.temp }}/static-bundle-summary/static-bundle-summary.json
          if-no-files-found: warn

  javascript:
    if: github.event_name == 'pull_request' && needs.changes.outputs.javascript == 'true'
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dashboard
        run: pnpm run build:dashboard

  supervisor:
    if: github.event_name == 'pull_request' && needs.changes.outputs.supervisor == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.21
          enable-cache: true
          cache-dependency-glob: services/supervisor/uv.lock

      - name: Sync supervisor virtualenv
        run: uv sync --directory services/supervisor --locked

      - name: Run supervisor preflight
        run: pnpm run test:supervisor:preflight

      - name: Run supervisor tests with duration profile
        run: pnpm run test:supervisor:profile -- --timeout-ms=600000

  full:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.21
          enable-cache: true
          cache-dependency-glob: services/supervisor/uv.lock

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync supervisor virtualenv
        run: uv sync --directory services/supervisor --locked

      - name: Configure repo-local Git hooks
        run: git config core.hooksPath .githooks

      - name: Fetch base branch for workspace protocol tests
        run: git fetch origin main:refs/remotes/origin/main

      - name: Run fast workflow checks
        run: pnpm run check:fast

      - name: Run full check
        run: pnpm run check

  check:
    if: always()
    needs:
      - changes
      - fast
      - static
      - javascript
      - supervisor
      - full
    runs-on: ubuntu-latest

    steps:
      - name: Verify required CI jobs
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ needs.full.result }}" != "success" ]; then
              echo "Full check failed or did not complete: ${{ needs.full.result }}"
              exit 1
            fi
            exit 0
          fi

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Change detection failed or did not complete: ${{ needs.changes.result }}"
            exit 1
          fi

          if [ "${{ needs.fast.result }}" != "success" ]; then
            echo "Fast workflow checks failed or did not complete: ${{ needs.fast.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.static }}" = "true" ] && [ "${{ needs.static.result }}" != "success" ]; then
            echo "Static checks were required but did not pass: ${{ needs.static.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.javascript }}" = "true" ] && [ "${{ needs.javascript.result }}" != "success" ]; then
            echo "JavaScript checks were required but did not pass: ${{ needs.javascript.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.supervisor }}" = "true" ] && [ "${{ needs.supervisor.result }}" != "success" ]; then
            echo "Supervisor checks were required but did not pass: ${{ needs.supervisor.result }}"
            exit 1
          fi
