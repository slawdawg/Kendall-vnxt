name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch, or tag to verify; defaults to the protected integration branch."
        required: false
        default: dev
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      javascript: ${{ steps.filter.outputs.javascript }}
      supervisor: ${{ steps.filter.outputs.supervisor }}
      static: ${{ steps.filter.outputs.static }}
      routing_mode: ${{ steps.filter.outputs.routing_mode }}
      selected_static_bundles: ${{ steps.filter.outputs.selected_static_bundles }}
      skipped_static_bundles: ${{ steps.filter.outputs.skipped_static_bundles }}
      routing_reasons: ${{ steps.filter.outputs.routing_reasons }}
      required_gates: ${{ steps.filter.outputs.required_gates }}
      skipped_required_gates: ${{ steps.filter.outputs.skipped_required_gates }}
      selected_workspace_profiles: ${{ steps.filter.outputs.selected_workspace_profiles }}
      selected_supervisor_shards: ${{ steps.filter.outputs.selected_supervisor_shards }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          ci_outputs="${RUNNER_TEMP}/ci-outputs.json"
          node ./scripts/check-plan.mjs \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --ci-outputs > "$ci_outputs"

          node -e 'const fs = require("node:fs"); const outputs = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); for (const key of ["javascript", "supervisor", "static"]) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${outputs[key] ? "true" : "false"}\n`); for (const key of ["routingMode", "selectedStaticBundles", "skippedStaticBundles", "routingReasons", "requiredGates", "skippedRequiredGates", "selectedWorkspaceProfiles", "selectedSupervisorShards"]) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key.replace(/[A-Z]/g, (letter) => `_${letter.toLowerCase()}`)}=${typeof outputs[key] === "string" ? outputs[key] : JSON.stringify(outputs[key])}\n`); const required = outputs.requiredGates.map((gate) => `- \`${gate.id}\`: ${gate.reason}`).join("\n"); const selected = outputs.selectedStaticBundles.map((bundle) => `- \`${bundle.id}\`: ${bundle.reasons.join("; ")}`).join("\n") || "- none"; const skipped = outputs.skippedStaticBundles.map((bundle) => `- \`${bundle.id}\`: ${bundle.reasons.join("; ")}`).join("\n") || "- none"; const workspace = outputs.selectedWorkspaceProfiles.map((profile) => `- \`${profile.id}\`: ${profile.reason}`).join("\n") || "- none"; const supervisor = outputs.selectedSupervisorShards.map((shard) => `- \`${shard.id}\`: ${shard.reason}`).join("\n") || "- none"; fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## CI routing (shadow)\n\nMode: \`${outputs.routingMode}\`\n\nCurrent required gates:\n${required}\n\nProspective selected static bundles:\n${selected}\n\nProspective skipped static bundles:\n${skipped}\n\nProspective workspace behavior profiles:\n${workspace}\n\nProspective supervisor behavior shards:\n${supervisor}\n\nReasons:\n${outputs.routingReasons.map((reason) => `- ${reason}`).join("\n") || "- no changed files"}\n`); console.log(JSON.stringify(outputs, null, 2));' "$ci_outputs"

  fast:
    if: github.event_name == 'pull_request'
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure repo-local Git hooks
        run: git config core.hooksPath .githooks

      - name: Fetch base branch for workspace protocol tests
        run: git fetch origin main:refs/remotes/origin/main

      - name: Run fast workflow checks
        run: pnpm run check:fast

  workspace_behavior_shadow:
    if: github.event_name == 'pull_request' && needs.changes.outputs.selected_workspace_profiles != '[]'
    needs: changes
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.changes.outputs.selected_workspace_profiles) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure repo-local Git hooks
        run: git config core.hooksPath .githooks

      - name: Fetch base branch for workspace protocol tests
        run: git fetch origin main:refs/remotes/origin/main

      - name: Run workspace behavior profile
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/ci-command-evidence"
          node ./scripts/run-ci-evidence-command.mjs \
            --report "$evidence_dir/workspace-${{ matrix.profile.id }}.json" \
            --route proposed \
            --selection-vector '{"id":"workspace-elevated","profile":"${{ matrix.profile.id }}"}' \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --lockfile-sha "$(git rev-parse HEAD:pnpm-lock.yaml)" \
            --environment-id "github-actions-ubuntu-latest-node22" \
            --cache-key "github-actions-run-${{ github.run_id }}" \
            -- pnpm run test:codex-workspace:${{ matrix.profile.id }}

      - name: Upload workspace behavior evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-command-evidence-workspace-${{ matrix.profile.id }}
          path: ${{ runner.temp }}/ci-command-evidence/workspace-${{ matrix.profile.id }}.json
          if-no-files-found: warn

  supervisor_behavior_shadow:
    if: github.event_name == 'pull_request' && needs.changes.outputs.selected_supervisor_shards != '[]'
    needs: changes
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.selected_supervisor_shards) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.21
          enable-cache: true
          cache-dependency-glob: services/supervisor/uv.lock

      - name: Sync supervisor virtualenv
        run: uv sync --directory services/supervisor --locked

      - name: Run supervisor behavior shard
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/ci-command-evidence"
          node ./scripts/run-ci-evidence-command.mjs \
            --report "$evidence_dir/supervisor-${{ matrix.shard.id }}.json" \
            --route proposed \
            --selection-vector '{"id":"supervisor-elevated","shard":"${{ matrix.shard.id }}"}' \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --lockfile-sha "$(git rev-parse HEAD:pnpm-lock.yaml)" \
            --environment-id "github-actions-ubuntu-latest-node22" \
            --cache-key "github-actions-run-${{ github.run_id }}" \
            -- pnpm run ${{ matrix.shard.script }}

      - name: Upload supervisor behavior evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-command-evidence-supervisor-${{ matrix.shard.id }}
          path: ${{ runner.temp }}/ci-command-evidence/supervisor-${{ matrix.shard.id }}.json
          if-no-files-found: warn

  static:
    if: always() && github.event_name == 'pull_request' && needs.changes.outputs.static == 'true'
    needs:
      - changes
      - fast
      - static_bundle
    runs-on: ubuntu-latest

    steps:
      - name: Verify required static bundle gate
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Change detection failed before static gate: ${{ needs.changes.result }}"
            exit 1
          fi

          if [ "${{ needs.fast.result }}" != "success" ]; then
            echo "Fast workflow checks failed before static gate: ${{ needs.fast.result }}"
            exit 1
          fi

          if [ "${{ needs.static_bundle.result }}" != "success" ]; then
            echo "Static bundle checks were required but did not pass: ${{ needs.static_bundle.result }}"
            exit 1
          fi

          echo "Required static bundle checks passed."

  static_bundle:
    if: github.event_name == 'pull_request' && needs.changes.outputs.static == 'true'
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bundle:
          - core
          - manager
          - workspace
          - policy
          - pipeline-dashboard
          - anti-churn

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure repo-local Git hooks
        run: git config core.hooksPath .githooks

      - name: Fetch base branch for workspace protocol tests
        run: git fetch origin main:refs/remotes/origin/main

      - name: Run static bundle report
        shell: bash
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/static-bundle-reports"
          mkdir -p "$report_dir"
          node ./scripts/run-static-bundle.mjs "${{ matrix.bundle }}" \
            --report "$report_dir/${{ matrix.bundle }}.json" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}"

      - name: Upload static bundle timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-bundle-report-${{ matrix.bundle }}
          path: ${{ runner.temp }}/static-bundle-reports/${{ matrix.bundle }}.json
          if-no-files-found: warn

  static_bundle_summary:
    if: always() && github.event_name == 'pull_request' && needs.changes.outputs.static == 'true'
    needs:
      - changes
      - static
      - static_bundle
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download static bundle timing reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: static-bundle-report-*
          path: ${{ runner.temp }}/static-bundle-reports
          merge-multiple: true

      - name: Summarize static bundle evidence
        shell: bash
        run: |
          set -euo pipefail
          summary_dir="${RUNNER_TEMP}/static-bundle-summary"
          mkdir -p "$summary_dir"
          node ./scripts/summarize-static-bundle-reports.mjs \
            --reports-dir "${RUNNER_TEMP}/static-bundle-reports" \
            --out "$summary_dir/static-bundle-summary.json" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --static-result "${{ needs.static.result }}" \
            --static-bundle-result "${{ needs.static_bundle.result }}" \
            --static-bundle-required

      - name: Upload static bundle summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-bundle-summary
          path: ${{ runner.temp }}/static-bundle-summary/static-bundle-summary.json
          if-no-files-found: warn

  promotion_evidence_summary:
    if: always() && github.event_name == 'pull_request'
    needs:
      - changes
      - static_bundle
      - supervisor
      - workspace_behavior_shadow
      - supervisor_behavior_shadow
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out PR head for source identity
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download command evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ci-command-evidence-*
          path: ${{ runner.temp }}/ci-promotion-reports
          merge-multiple: true

      - name: Download workspace aggregate evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: static-bundle-report-workspace
          path: ${{ runner.temp }}/ci-promotion-reports

      - name: Collect same-head route observation
        shell: bash
        run: |
          set -euo pipefail
          out_dir="${RUNNER_TEMP}/ci-promotion-observation"
          mkdir -p "$out_dir"
          node ./scripts/collect-ci-promotion-observations.mjs \
            --reports-dir "${RUNNER_TEMP}/ci-promotion-reports" \
            --out "$out_dir/observation.json" \
            --pair-id "${{ github.run_id }}:${{ github.run_attempt }}" \
            --cohort ordinary \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --lockfile-sha "$(git rev-parse HEAD:pnpm-lock.yaml)" \
            --environment-id "github-actions-ubuntu-latest-node22"

      - name: Upload promotion observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-promotion-observation
          path: ${{ runner.temp }}/ci-promotion-observation/observation.json
          if-no-files-found: warn

  javascript:
    if: github.event_name == 'pull_request' && needs.changes.outputs.javascript == 'true'
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dashboard
        run: pnpm run build:dashboard

  supervisor:
    if: github.event_name == 'pull_request' && needs.changes.outputs.supervisor == 'true'
    needs: changes
    runs-on: ubuntu-latest
    # Keep five minutes above the child profile for setup and job teardown,
    # so GitHub does not cancel a still-healthy bounded test process.
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.21
          enable-cache: true
          cache-dependency-glob: services/supervisor/uv.lock

      - name: Sync supervisor virtualenv
        run: uv sync --directory services/supervisor --locked

      - name: Run supervisor preflight
        run: pnpm run test:supervisor:preflight

      - name: Run supervisor tests with duration profile
        # Full supervisor teardown can outlive the test assertions; retain a
        # bounded 15-minute budget. Recent CI needed 12 minutes (including
        # asynchronous SQLite cleanup) after pytest reported success; the
        # 20-minute parent job preserves five minutes for setup and teardown.
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/ci-command-evidence"
          node ./scripts/run-ci-evidence-command.mjs \
            --report "$evidence_dir/supervisor-aggregate.json" \
            --route baseline \
            --selection-vector '{"id":"supervisor-elevated","shape":"aggregate"}' \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --lockfile-sha "$(git rev-parse HEAD:pnpm-lock.yaml)" \
            --environment-id "github-actions-ubuntu-latest-node22" \
            --cache-key "github-actions-run-${{ github.run_id }}" \
            -- pnpm run test:supervisor:profile -- --timeout-ms=900000

      - name: Upload supervisor aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-command-evidence-supervisor-aggregate
          path: ${{ runner.temp }}/ci-command-evidence/supervisor-aggregate.json
          if-no-files-found: warn

  full:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event_name == 'schedule' && 'dev' || github.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.21
          enable-cache: true
          cache-dependency-glob: services/supervisor/uv.lock

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync supervisor virtualenv
        run: uv sync --directory services/supervisor --locked

      - name: Configure repo-local Git hooks
        run: git config core.hooksPath .githooks

      - name: Fetch base branch for workspace protocol tests
        run: git fetch origin main:refs/remotes/origin/main

      - name: Run fast workflow checks
        run: pnpm run check:fast

      - name: Run full check
        run: pnpm run check

  check:
    if: always()
    needs:
      - changes
      - fast
      - static
      - javascript
      - supervisor
      - full
    runs-on: ubuntu-latest

    steps:
      - name: Verify required CI jobs
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            if [ "${{ needs.full.result }}" != "success" ]; then
              echo "Full check failed or did not complete: ${{ needs.full.result }}"
              exit 1
            fi
            exit 0
          fi

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Change detection failed or did not complete: ${{ needs.changes.result }}"
            exit 1
          fi

          if [ "${{ needs.fast.result }}" != "success" ]; then
            echo "Fast workflow checks failed or did not complete: ${{ needs.fast.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.static }}" = "true" ] && [ "${{ needs.static.result }}" != "success" ]; then
            echo "Static checks were required but did not pass: ${{ needs.static.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.javascript }}" = "true" ] && [ "${{ needs.javascript.result }}" != "success" ]; then
            echo "JavaScript checks were required but did not pass: ${{ needs.javascript.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.supervisor }}" = "true" ] && [ "${{ needs.supervisor.result }}" != "success" ]; then
            echo "Supervisor checks were required but did not pass: ${{ needs.supervisor.result }}"
            exit 1
          fi
