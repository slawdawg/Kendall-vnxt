name: Preserve PR Review Threads for Governed Resolution

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  pull-requests: read

jobs:
  preserve-review-threads:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest

    steps:
      - name: Preserve unresolved review threads
        shell: bash
        run: |
          set -euo pipefail
          echo "Automatic review-thread resolution is disabled."
          echo "Use the governed codex-workspace review-thread gate after individual adjudication,"
          echo "current-head evidence, and a post-resolution audit."
